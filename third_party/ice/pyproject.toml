[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-v01"
version = "0.1.0"
description = "Immutable Chain Evidence — signed, hash-chained Inference Receipts for Agent Faces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "REKT☆WRLD Labs"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Dhammerr6304/ice-v01"
Repository = "https://github.com/Dhammerr6304/ice-v01"

[tool.setuptools.packages.find]
where = ["src"]
