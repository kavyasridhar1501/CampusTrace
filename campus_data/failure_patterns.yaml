# Failure patterns for the simulated campus. DRAFT for Kavya's review; frozen once approved.
# Used by the repair-history generator (agent/repairs/history.py) now and by the SimPy
# failure model later. Changing this file after the agent is tuned breaks the
# "write the failure model first, then freeze it" rule.
#
# rate_per_year: expected failures per asset per year at age_ref years old.
# age_factor_per_decade: multiplier for every ten years past age_ref (older fails more).
# patterns: weight is relative within the asset type. symptoms are what the affected
#   rooms report; spread is the share of served rooms that notice.
# season: multipliers by month group (winter = Dec-Feb, summer = Jun-Sep).

age_ref: 10

# Assets that fail far more often than their type and age explain (the plan's
# "a few chronic assets"). Multiplies the asset's rate.
chronic:
  CSE-AHU-3: 4.0
  CHEM-BLR-1: 3.0
  LIB-AHU-2: 3.0
  SSB-PR-1: 2.5

asset_types:
  air_handler:
    trade: hvac
    rate_per_year: 1.6
    age_factor_per_decade: 1.3
    patterns:
      - {id: ahu-damper-actuator, weight: 4, symptoms: [too_cold, too_hot], spread: 0.6,
         cause: "Outside-air damper actuator failed; damper stuck closed", action: "Replaced damper actuator, recalibrated", parts: [damper actuator], minutes: [90, 180]}
      - {id: ahu-belt, weight: 3, symptoms: [no_airflow, noise], spread: 0.7,
         cause: "Supply fan belt worn and slipping", action: "Replaced fan belt, re-tensioned", parts: [fan belt], minutes: [45, 90]}
      - {id: ahu-vfd-fault, weight: 2, symptoms: [no_airflow, too_hot], spread: 0.9,
         cause: "Supply fan VFD tripped on overcurrent", action: "Reset VFD, cleaned heat sink, checked motor amps", parts: [], minutes: [60, 120]}
      - {id: ahu-heating-valve, weight: 3, symptoms: [too_cold], spread: 0.6, season: {winter: 2.0},
         cause: "Heating coil valve stuck closed", action: "Freed and lubricated valve stem, replaced valve actuator", parts: [valve actuator], minutes: [90, 150]}
      - {id: ahu-cooling-valve, weight: 3, symptoms: [too_hot], spread: 0.6, season: {summer: 2.0},
         cause: "Chilled water valve stuck closed", action: "Replaced chilled water valve actuator", parts: [valve actuator], minutes: [90, 150]}
      - {id: ahu-drain-pan, weight: 2, symptoms: [odor, leak], spread: 0.3,
         cause: "Condensate drain pan clogged; standing water and mould", action: "Cleared drain line, cleaned and treated pan", parts: [pan tablets], minutes: [60, 120]}
      - {id: ahu-filters, weight: 2, symptoms: [no_airflow, odor], spread: 0.4,
         cause: "Filters loaded past rated pressure drop", action: "Replaced filter bank", parts: [filters], minutes: [45, 90]}
      - {id: ahu-controls, weight: 2, symptoms: [too_cold, too_hot], spread: 0.8,
         cause: "Discharge air temperature sensor reading wrong", action: "Replaced DAT sensor, verified BAS trend", parts: [temperature sensor], minutes: [60, 120]}

  hvac_zone:
    trade: hvac
    rate_per_year: 0.5
    age_factor_per_decade: 1.2
    patterns:
      - {id: vav-damper, weight: 4, symptoms: [too_cold, too_hot], spread: 1.0,
         cause: "VAV box damper actuator failed", action: "Replaced VAV actuator", parts: [VAV actuator], minutes: [45, 90]}
      - {id: vav-reheat, weight: 3, symptoms: [too_cold], spread: 1.0, season: {winter: 2.0},
         cause: "Reheat valve on VAV box stuck closed", action: "Replaced reheat valve actuator", parts: [valve actuator], minutes: [60, 120]}
      - {id: thermostat, weight: 3, symptoms: [too_cold, too_hot], spread: 0.5,
         cause: "Zone thermostat out of calibration", action: "Recalibrated zone sensor", parts: [], minutes: [20, 45]}

  plant:
    trade: hvac
    rate_per_year: 1.0
    age_factor_per_decade: 1.4
    patterns:
      - {id: boiler-ignition, weight: 3, symptoms: [too_cold, no_hot_water], spread: 0.5, season: {winter: 2.5}, kinds: [boiler],
         cause: "Boiler flame sensor fouled; lockout on ignition failure", action: "Cleaned flame sensor, reset lockout, test fired", parts: [], minutes: [60, 120]}
      - {id: boiler-pump, weight: 2, symptoms: [too_cold], spread: 0.7, season: {winter: 2.0}, kinds: [boiler],
         cause: "Hot water circulation pump seal leaking, pump tripped", action: "Replaced pump seal kit", parts: [pump seal kit], minutes: [120, 240]}
      - {id: chiller-trip, weight: 3, symptoms: [too_hot], spread: 0.7, season: {summer: 2.5}, kinds: [chiller],
         cause: "Chiller tripped on low refrigerant pressure", action: "Found and repaired leak at flare fitting, recharged", parts: [refrigerant], minutes: [180, 360]}
      - {id: chiller-condenser, weight: 2, symptoms: [too_hot], spread: 0.5, season: {summer: 2.0}, kinds: [chiller],
         cause: "Condenser tubes fouled; high head pressure", action: "Brushed condenser tubes", parts: [], minutes: [240, 420]}

  panel:
    trade: electrical
    rate_per_year: 0.15
    age_factor_per_decade: 1.3
    patterns:
      - {id: panel-breaker, weight: 3, symptoms: [no_power, lights_out], spread: 0.6,
         cause: "Feeder breaker tripped on overload", action: "Identified overloaded branch, rebalanced loads, reset breaker", parts: [], minutes: [60, 120]}
      - {id: panel-connection, weight: 2, symptoms: [flickering_lights, no_power], spread: 0.5,
         cause: "Loose lug on neutral bus, heating", action: "Re-torqued lugs, replaced damaged conductor end", parts: [lug], minutes: [90, 180]}

  circuit:
    trade: electrical
    rate_per_year: 0.2
    age_factor_per_decade: 1.2
    patterns:
      - {id: circuit-trip, weight: 4, symptoms: [no_power], spread: 1.0,
         cause: "Branch breaker tripped; space heater on circuit", action: "Removed space heater, reset breaker, informed occupant", parts: [], minutes: [20, 45]}
      - {id: circuit-gfci, weight: 2, symptoms: [no_power], spread: 0.7,
         cause: "GFCI receptacle failed", action: "Replaced GFCI receptacle", parts: [GFCI receptacle], minutes: [30, 60]}
      - {id: circuit-ballast, weight: 3, symptoms: [flickering_lights, lights_out], spread: 0.5,
         cause: "LED driver failing", action: "Replaced LED driver", parts: [LED driver], minutes: [30, 60]}

  elevator_bank:
    trade: electrical
    rate_per_year: 1.2
    age_factor_per_decade: 1.3
    patterns:
      - {id: elevator-door, weight: 4, symptoms: [elevator_stopped], spread: 0.3,
         cause: "Door operator out of adjustment; door reopening", action: "Adjusted door operator, cleaned sill track (vendor)", parts: [], minutes: [60, 120]}
      - {id: elevator-leveling, weight: 2, symptoms: [elevator_stopped], spread: 0.3,
         cause: "Leveling sensor fault; car stopping out of level", action: "Replaced leveling sensor (vendor)", parts: [leveling sensor], minutes: [90, 180]}

  water_heater:
    trade: plumbing
    rate_per_year: 0.4
    age_factor_per_decade: 1.4
    patterns:
      - {id: wh-element, weight: 3, symptoms: [no_hot_water], spread: 0.8,
         cause: "Lower heating element burned out", action: "Replaced heating element", parts: [heating element], minutes: [60, 120]}
      - {id: wh-thermostat, weight: 2, symptoms: [no_hot_water], spread: 0.6,
         cause: "Tank thermostat failed", action: "Replaced thermostat", parts: [thermostat], minutes: [45, 90]}
      - {id: wh-recirc, weight: 2, symptoms: [no_hot_water], spread: 0.4,
         cause: "Recirculation pump seized; hot water slow to arrive", action: "Replaced recirc pump", parts: [recirc pump], minutes: [90, 150]}

  plumbing_riser:
    trade: plumbing
    rate_per_year: 0.6
    age_factor_per_decade: 1.3
    patterns:
      - {id: riser-stack-clog, weight: 3, symptoms: [clog, odor], spread: 0.5,
         cause: "Partial blockage in waste stack", action: "Snaked stack from cleanout", parts: [], minutes: [90, 180]}
      - {id: riser-valve-leak, weight: 2, symptoms: [leak], spread: 0.2,
         cause: "Isolation valve packing leaking in chase", action: "Repacked valve", parts: [valve packing], minutes: [60, 120]}
      - {id: riser-pressure, weight: 2, symptoms: [low_water_pressure], spread: 0.6,
         cause: "Pressure reducing valve failing", action: "Rebuilt PRV", parts: [PRV rebuild kit], minutes: [120, 180]}

  # Room-level faults: fixtures and finishes inside one room.
  room:
    trade: null  # from the pattern
    rate_per_year: 0.08
    age_factor_per_decade: 1.1
    patterns:
      - {id: room-toilet-clog, weight: 4, symptoms: [clog], spread: 1.0, trade: plumbing, room_types: [restroom, locker_room],
         cause: "Toilet clogged", action: "Augered toilet", parts: [], minutes: [20, 45]}
      - {id: room-faucet-leak, weight: 3, symptoms: [leak], spread: 1.0, trade: plumbing, room_types: [restroom, kitchen, wet_lab, locker_room],
         cause: "Faucet cartridge worn", action: "Replaced cartridge", parts: [faucet cartridge], minutes: [30, 60]}
      - {id: room-ceiling-leak, weight: 2, symptoms: [leak], spread: 1.0, trade: structural,
         cause: "Roof flashing failed above ceiling", action: "Patched flashing, replaced stained ceiling tiles", parts: [ceiling tiles, flashing sealant], minutes: [120, 240]}
      - {id: room-door-closer, weight: 3, symptoms: [door_lock], spread: 1.0, trade: structural,
         cause: "Door closer leaking oil, door not latching", action: "Replaced door closer", parts: [door closer], minutes: [45, 90]}
      - {id: room-spill, weight: 2, symptoms: [spill], spread: 1.0, trade: custodial, room_types: [dining, lobby, hallway, classroom, lecture_hall],
         cause: "Spill on floor", action: "Cleaned and dried floor, placed sign", parts: [], minutes: [15, 30]}
