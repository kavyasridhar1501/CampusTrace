name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+psycopg://campus:campus@localhost:5432/campus
      TEST_DATABASE_URL: postgresql+psycopg://campus:campus@localhost:5432/campus_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install Python 3.12 and dependencies
        run: uv sync --locked --python 3.12

      - name: Start Postgres (PostGIS + pgvector)
        run: docker compose -f infra/docker-compose.yml up -d --build --wait db

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy agent

      - name: Validate campus data
        run: uv run python -m agent.campus.validate campus_data

      - name: Migrate main database
        run: uv run alembic -c infra/alembic.ini upgrade head

      - name: Tests
        run: uv run pytest

      # The safety-override and prompt-injection suite (tests/safety) gets its own job
      # here when it lands on Dec 1. Any miss in it fails the build.
