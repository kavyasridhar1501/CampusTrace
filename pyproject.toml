[project]
name = "campustrace"
version = "0.1.0"
description = "Campus facilities agent: traces building complaints to the failing equipment, schedules the fix, and checks it stayed fixed."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "alembic==1.20.1",
    "anthropic==2.3.0",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "geoalchemy2==0.20.0",
    "httpx==0.28.1",
    "ice-v01",
    "langfuse==5.0.4",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "networkx==3.7",
    "ortools==9.15.6755",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "simpy==4.1.2",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
    "voyageai==0.5.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
package = true

[tool.uv.sources]
# ICE V.01 is vendored unmodified under third_party/ice and installed from there.
ice-v01 = { path = "third_party/ice", editable = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "sim", "data311", "api", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["third_party/", "infra/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["networkx.*", "ice.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running Postgres (DATABASE_URL / TEST_DATABASE_URL); skipped when unreachable",
]
addopts = "-ra"
